# Pre-commit hooks configuration
# Install: pip install pre-commit && pre-commit install

repos:
  # Gitleaks - detect secrets before commit
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.3
    hooks:
      - id: gitleaks

  # Pre-commit-hooks - basic code quality
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=10000']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict

  # Black - code formatting
  - repo: https://github.com/psf/black
    rev: 23.11.0
    hooks:
      - id: black
        language_version: python3.9

  # isort - import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ['--profile', 'black']

  # Flake8 - linting
  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: ['--max-line-length=120', '--ignore=E501,W503,E203']

  # Second-brain integrity — the atom pool's only enforcement point.
  # Added 2026-08-19. Five of six condensation layers in this repo died because their
  # conventions were documented but never enforced; the one that survived had a checker
  # that nothing ran automatically. These make Law 6 in brain/README.md a fact.
  - repo: local
    hooks:
      - id: check-ideas-integrity
        name: idea pool integrity (IDs, reciprocal edges, slug match, live links)
        entry: python3 scripts/check_ideas_integrity.py
        language: system
        pass_filenames: false
        files: ^book_notes/playground/reports/.*\.md$
      - id: check-brain-integrity
        name: brain integrity (concepts, verdicts, wikilinks, index sync)
        entry: python3 scripts/check_brain_integrity.py
        language: system
        pass_filenames: false
        files: ^book_notes/playground/(brain|reports)/.*\.md$
